# This profile is intentionally scoped to a visible, foreground window.
# Coordinates are relative to the target window's client area, not the screen.
window:
  title_contains: "My Test Game"
  # Set automatically when selected in the desktop UI; avoids binding to a same-named window.
  # process_id: 1234
  require_foreground: true

hotkeys:
  toggle: "F8"
  emergency_stop: "F12"

capture:
  # Foreground/window checks remain responsive while capture and recognition are throttled.
  poll_interval_ms: 100
  recognition_interval_ms: 500
  save_debug_frame: false

health_bar:
  # Left, top, width, height in client-area pixels at your selected UI scale.
  roi: [40, 45, 220, 18]
  # OpenCV HSV ranges. Tune after collecting a debug capture.
  hsv_lower: [0, 110, 80]
  hsv_upper: [10, 255, 255]
  # A column counts as filled when this fraction of its pixels matches the color.
  column_coverage: 0.35
  # Never issue a key if this is below the detector confidence.
  min_confidence: 0.70
  # Require this many confident frames before an action can trigger.
  consecutive_frames: 2
  # Optional extra color bands. Useful when the target color crosses the HSV hue boundary.
  # hsv_ranges:
  #   - lower: [170, 110, 80]
  #     upper: [179, 255, 255]

rules:
  heal_below_percent: 30
  heal_key: "5"
  cooldown_ms: 1500
  hold_ms: 50
  # `heal_key` accepts chords and sequences, e.g. "CTRL+1" or "1,2".

# Optional rules are evaluated after the primary rule.
# additional_rules:
#   - name: "Emergency heal"
#     heal_below_percent: 15
#     heal_key: "CTRL+5"
#     cooldown_ms: 3000
#     hold_ms: 80
