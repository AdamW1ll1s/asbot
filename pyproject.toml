[project]
name = "game-assist"
version = "0.1.0"
description = "A Windows visual automation starter for authorized local testing"
requires-python = ">=3.11"
dependencies = [
  "mss>=10.0.0",
  "numpy>=2.0.0",
  "opencv-python>=4.10.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
game-assist = "game_assist.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
