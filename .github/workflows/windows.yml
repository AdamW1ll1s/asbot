name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test and build distributable package
        shell: powershell
        run: .\scripts\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GameAssist-Windows-${{ github.sha }}
          path: |
            dist/GameAssist-Windows.zip
            dist/GameAssist/game-assist.exe
          if-no-files-found: error
          retention-days: 14
