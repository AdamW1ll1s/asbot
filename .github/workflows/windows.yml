name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt nuitka
      - name: Run tests
        run: pytest
      - name: Build executable
        run: python -m nuitka --onefile --output-filename=game-assist.exe --include-package=game_assist run.py
      - uses: actions/upload-artifact@v4
        with:
          name: game-assist-windows
          path: game-assist.exe
